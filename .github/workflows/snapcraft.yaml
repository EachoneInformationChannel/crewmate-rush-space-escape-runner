name: crewmate-rush-space-escape-runner
base: core22
version: '1.0'
summary: Crewmate Rush Space Escape Runner Game
description: |
  An action-packed 3-lane space escape runner featuring crewmate tasks.

grade: stable
confinement: strict

apps:
  crewmate-rush-space-escape-runner:
    command: bin/desktop-launch $SNAP/bin/node $SNAP/dist/server.cjs
    extensions: [gnome]
    plugs:
      - x11
      - opengl
      - network
      - audio-playback

parts:
  my-game:
    plugin: nil
    source: .
    build-packages:
      - curl
      - git
    override-build: |
      # Install Node.js 20 directly in build environment
      curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
      apt-get install -y nodejs

      npm install
      npm run build
      
      # Copy built files to snap install directory
      mkdir -p $CRAFT_PART_INSTALL/dist
      mkdir -p $CRAFT_PART_INSTALL/bin
      cp -r dist/* $CRAFT_PART_INSTALL/dist/
      cp -r node_modules $CRAFT_PART_INSTALL/ 2>/dev/null || true
      cp server.cjs $CRAFT_PART_INSTALL/ 2>/dev/null || true
