name: Release to Snap Store

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies and Build
      run: |
        npm install
        npm run build

    - name: Build Snap
      uses: snapcore/action-build@v1
      with:
        path: .

    - name: Upload to Snap Store via CLI
      env:
        SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
      run: |
        echo "Uploading generated snap file directly..."
        snapcraft upload --release=stable crewmate-rush-space-escape-runner_1.0_amd64.snap
