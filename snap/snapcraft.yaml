name: crewmate-rush-space-escape-runner
base: core22
version: '1.0'
summary: Crewmate Rush Space Escape Runner Game
description: |
  An action-packed 3-lane space escape runner featuring crewmate tasks.

grade: stable
confinement: strict

apps:
  crewmate-rush-space-escape-runner:
    command: usr/bin/node $SNAP/server.cjs
    plugs:
      - network
      - audio-playback

parts:
  my-game:
    plugin: dump
    source: .
    stage-packages:
      - nodejs
    organize:
      dist: dist
      server.cjs: server.cjs
