name: Publish to Snap Store

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    # 1. GitHub runner par Node.js setup karke game build karein
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies and Build
      run: |
        npm install
        npm run build

    # 2. Official Snap Build Action (Ab yeh bani hui files ko snap bana dega)
    - name: Build Snap
      uses: snapcore/action-build@v1
      with:
        path: .

    # 3. Official Upload Action
    - name: Upload to Snap Store
      uses: snapcore/action-publish@v1
      env:
        SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
